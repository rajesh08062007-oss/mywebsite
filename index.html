```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Weather WhatsApp Login</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #075e54, #128c7e, #25d366);
    overflow: hidden;
}

/* Animated background */
body::before,
body::after {
    content: "";
    position: absolute;
    width: 300px;
    height: 300px;
    border-radius: 50%;
    background: rgba(255,255,255,0.12);
    animation: float 7s infinite ease-in-out;
}

body::before {
    top: -100px;
    left: -80px;
}

body::after {
    bottom: -100px;
    right: -80px;
    animation-delay: 2s;
}

@keyframes float {
    0%,100% {
        transform: translateY(0) scale(1);
    }
    50% {
        transform: translateY(-30px) scale(1.1);
    }
}

.container {
    position: relative;
    z-index: 2;
    width: 380px;
    max-width: 92%;
    background: rgba(255,255,255,0.96);
    border-radius: 25px;
    padding: 30px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    text-align: center;
    animation: appear 0.8s ease;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(40px) scale(0.9);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.logo {
    width: 75px;
    height: 75px;
    margin: auto;
    border-radius: 50%;
    background: #25d366;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 42px;
    color: white;
    box-shadow: 0 8px 20px rgba(37,211,102,0.4);
    animation: pulse 2s infinite;
}

@keyframes pulse {
    0%,100% {
        transform: scale(1);
    }
    50% {
        transform: scale(1.08);
    }
}

h1 {
    margin-top: 18px;
    color: #075e54;
}

.subtitle {
    margin: 8px 0 25px;
    color: #666;
}

.input-box {
    display: flex;
    margin-bottom: 15px;
}

.country {
    width: 75px;
    border: 1px solid #ddd;
    border-radius: 12px 0 0 12px;
    padding: 13px 5px;
    background: #f5f5f5;
}

input {
    width: 100%;
    border: 1px solid #ddd;
    border-left: none;
    border-radius: 0 12px 12px 0;
    padding: 13px;
    font-size: 16px;
    outline: none;
}

input:focus {
    border-color: #25d366;
}

button {
    width: 100%;
    border: none;
    padding: 14px;
    border-radius: 12px;
    background: #25d366;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #128c7e;
    transform: translateY(-2px);
}

.message {
    margin-top: 15px;
    min-height: 22px;
    font-size: 14px;
}

.weather {
    display: none;
    margin-top: 20px;
    animation: slideUp 0.6s ease;
}

@keyframes slideUp {
    from {
        opacity: 0;
        transform: translateY(25px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.weather-card {
    background: linear-gradient(135deg, #e8fff1, #ffffff);
    border-radius: 18px;
    padding: 20px;
    margin-top: 15px;
    border: 1px solid #d8f5e2;
}

.weather-icon {
    font-size: 55px;
}

.temperature {
    font-size: 42px;
    font-weight: bold;
    color: #075e54;
    margin: 5px;
}

.location {
    color: #555;
    margin-bottom: 12px;
}

.details {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.detail {
    background: white;
    padding: 10px;
    border-radius: 10px;
    font-size: 13px;
}

.logout {
    margin-top: 12px;
    background: #555;
}

.logout:hover {
    background: #333;
}

.loading {
    display: none;
    margin-top: 15px;
}

.spinner {
    width: 30px;
    height: 30px;
    border: 4px solid #ddd;
    border-top-color: #25d366;
    border-radius: 50%;
    margin: auto;
    animation: spin 0.8s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

.footer {
    margin-top: 20px;
    font-size: 12px;
    color: #888;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">☁️</div>

    <h1>Weather Login</h1>

    <p class="subtitle">
        Login with your WhatsApp number
    </p>

    <!-- LOGIN -->
    <div id="loginBox">

        <div class="input-box">
            <div class="country">🇮🇳 +91</div>
            <input
                id="phone"
                type="tel"
                maxlength="10"
                placeholder="WhatsApp number">
        </div>

        <button onclick="login()">
            📱 Continue with WhatsApp
        </button>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="margin-top:8px;">Checking...</p>
        </div>

        <div class="message" id="message"></div>

    </div>

    <!-- WEATHER -->
    <div class="weather" id="weatherBox">

        <h2>🌤️ Current Weather</h2>

        <div class="weather-card">

            <div class="weather-icon" id="weatherIcon">
                ☀️
            </div>

            <div class="temperature" id="temperature">
                --°C
            </div>

            <div class="location" id="location">
                Detecting location...
            </div>

            <div class="details">

                <div class="detail">
                    💧 Humidity
                    <br>
                    <b id="humidity">--%</b>
                </div>

                <div class="detail">
                    💨 Wind
                    <br>
                    <b id="wind">-- km/h</b>
                </div>

            </div>

        </div>

        <button class="logout" onclick="logout()">
            Logout
        </button>

    </div>

    <div class="footer">
        Weather data provided by Open-Meteo
    </div>

</div>

<script>

function login() {

    const phone = document.getElementById("phone").value.trim();
    const message = document.getElementById("message");
    const loading = document.getElementById("loading");

    if (!/^[0-9]{10}$/.test(phone)) {
        message.style.color = "red";
        message.innerText = "Please enter a valid 10-digit number.";
        return;
    }

    message.innerText = "";
    loading.style.display = "block";

    /*
       Demo login only.
       Real WhatsApp OTP requires an official
       WhatsApp Business/Cloud API backend.
    */

    setTimeout(() => {

        loading.style.display = "none";

        document.getElementById("loginBox").style.display = "none";
        document.getElementById("weatherBox").style.display = "block";

        getWeather();

    }, 1200);
}


function getWeather() {

    if (!navigator.geolocation) {
        alert("Your browser does not support location.");
        return;
    }

    navigator.geolocation.getCurrentPosition(

        async function(position) {

            const latitude = position.coords.latitude;
            const longitude = position.coords.longitude;

            try {

                const url =
                `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code&timezone=auto`;

                const response = await fetch(url);

                const data = await response.json();

                const current = data.current;

                document.getElementById("temperature").innerText =
                    Math.round(current.temperature_2m) + "°C";

                document.getElementById("humidity").innerText =
                    current.relative_humidity_2m + "%";

                document.getElementById("wind").innerText =
                    current.wind_speed_10m + " km/h";

                document.getElementById("location").innerText =
                    `Lat: ${latitude.toFixed(2)}, Lon: ${longitude.toFixed(2)}`;

                document.getElementById("weatherIcon").innerText =
                    getWeatherIcon(current.weather_code);

            } catch (error) {

                document.getElementById("location").innerText =
                    "Unable to load weather.";

            }
        },

        function() {

            document.getElementById("location").innerText =
                "Location permission denied.";

        }
    );
}


function getWeatherIcon(code) {

    if (code === 0)
        return "☀️";

    if (code >= 1 && code <= 3)
        return "🌤️";

    if (code >= 45 && code <= 48)
        return "🌫️";

    if (code >= 51 && code <= 67)
        return "🌧️";

    if (code >= 71 && code <= 77)
        return "❄️";

    if (code >= 80 && code <= 82)
        return "🌦️";

    if (code >= 95)
        return "⛈️";

    return "🌤️";
}


function logout() {

    document.getElementById("weatherBox").style.display = "none";
    document.getElementById("loginBox").style.display = "block";

    document.getElementById("phone").value = "";

    document.getElementById("message").innerText = "";
}

</script>

</body>
</html>
```
